name: Conventional commits

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test the validator
        run: python -m unittest discover -s tests -p 'test_check_commits.py'
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | python scripts/check_commits.py --message-file -
      - name: Check new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(python -c 'import json; print(json.load(open("release-please-config.json"))["bootstrap-sha"])')
          fi
          python scripts/check_commits.py --range "$BASE_SHA..$HEAD_SHA"
