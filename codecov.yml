coverage:
  precision: 2
  status:
    project:
      default:
        target: auto
        informational: true
        paths:
          - custom_components/samsungehs/
    patch:
      default:
        target: 95%
        threshold: 0%
        paths:
          - custom_components/samsungehs/
      config-flow-and-diagnostics:
        target: 100%
        threshold: 0%
        paths:
          - custom_components/samsungehs/config_flow.py
          - custom_components/samsungehs/diagnostics.py

comment:
  layout: "diff, files"
  behavior: default
  require_changes: true
