# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

target-version = "py313"

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "D203", # no-blank-line-before-class (incompatible with formatter)
    "D212", # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "ISC001", # incompatible with formatter
]

[lint.flake8-pytest-style]
fixture-parentheses = false

[lint.pyupgrade]
keep-runtime-typing = true

[lint.mccabe]
max-complexity = 25

[lint.per-file-ignores]
# These CLI checks invoke Git with argument lists and report results to the user.
"scripts/check_commits.py" = ["INP001", "S603", "S607", "T201"]
# The dependency-free test runner uses unittest assertions and local subprocesses.
"tests/test_check_commits.py" = ["PT009", "S603", "S607"]
# Pytest fixtures use injected arguments, literal expectations and library internals.
"tests/**" = ["S101", "PLR2004", "PLR0913", "ARG001", "SLF001"]
# This command reports per-module coverage failures to CI.
"scripts/check_coverage.py" = ["INP001", "T201"]
# HA callback signatures include framework arguments even when unused.
"custom_components/samsungehs/*.py" = ["ARG001", "ARG002", "ARG003"]
